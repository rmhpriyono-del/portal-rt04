<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lupa Password Portal RT04/RW04</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="auth-page">
    <div class="auth-shell">
      <div class="auth-visual">
        <div class="auth-visual-card">
          <h1>Reset Password</h1>
          <p>Masukkan alamat email Anda untuk menerima instruksi pemulihan akun.</p>
        </div>
      </div>

      <div class="auth-form-wrap">
        <div class="auth-header">
          <p class="eyebrow">Keamanan</p>
          <h2>Lupa password?</h2>
        </div>

        <form class="auth-form" id="resetForm">
          <div>
            <label for="resetEmail">Email</label>
            <input id="resetEmail" type="email" placeholder="Masukkan email Anda" required />
          </div>

          <div class="auth-actions">
            <a href="login.html">Kembali ke login</a>
            <button type="submit" class="btn btn-primary">Kirim</button>
          </div>

          <div id="resetMessage" class="status-message" aria-live="polite"></div>
        </form>
      </div>
    </div>

    <script>
      const resetForm = document.getElementById('resetForm');
      const resetMessage = document.getElementById('resetMessage');

      resetForm.addEventListener('submit', function (event) {
        event.preventDefault();

        const email = document.getElementById('resetEmail').value.trim();

        if (!email) {
          resetMessage.className = 'status-message error';
          resetMessage.textContent = 'Email harus diisi.';
          return;
        }

        resetMessage.className = 'status-message success';
        resetMessage.textContent = 'Instruksi reset password telah dikirim ke email Anda.';
      });
    </script>
  </body>
</html>
