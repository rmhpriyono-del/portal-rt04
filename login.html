<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Portal RT04/RW04</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="auth-page">
    <div class="auth-shell">
      <div class="auth-visual">
        <div class="auth-visual-card">
          <h1>Portal Warga RT/RW 04</h1>
          <p>Informasi, agenda, komunikasi, dan layanan warga dalam satu platform modern.</p>
        </div>
      </div>

      <div class="auth-form-wrap">
        <div class="auth-header">
          <p class="eyebrow">Akses Warga</p>
          <h2>Masuk ke akun Anda</h2>
        </div>

        <form class="auth-form" id="loginForm">
          <div>
            <label for="username">Nama Lengkap</label>
            <input id="username" type="text" placeholder="Masukkan nama lengkap" required />
          </div>

          <div>
            <label for="password">NIK</label>
            <input id="password" type="password" inputmode="numeric" maxlength="16" placeholder="Masukkan 16 digit NIK" required />
          </div>

          <div class="auth-actions">
            <a href="index.html">Kembali</a>
            <button type="submit" class="btn btn-primary">Masuk</button>
          </div>

          <div class="auth-links">
            <a href="register.html">Buat akun baru</a>
            <a href="forgot-password.html">Lupa password?</a>
          </div>

          <div id="message" class="status-message" aria-live="polite"></div>
        </form>
      </div>
    </div>

    <script>
      const form = document.getElementById('loginForm');
      const message = document.getElementById('message');

      form.addEventListener('submit', function (event) {
        event.preventDefault();

        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();

        if (!username || !password) {
          message.className = 'status-message error';
          message.textContent = 'Username dan password harus diisi.';
          return;
        }

        const wargaAccounts = JSON.parse(localStorage.getItem('rt04-warga-accounts') || '[]');
        const wargaAccount = wargaAccounts.find((account) => account.name.toLowerCase() === username.toLowerCase() && account.nik === password);

        if ((username.toLowerCase() === 'admin' && password === '12345') || wargaAccount) {
          message.className = 'status-message success';
          message.textContent = 'Login berhasil. Mengalihkan ke dashboard...';

          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 800);
        } else {
          message.className = 'status-message error';
          message.textContent = 'Nama lengkap atau NIK salah. Silakan periksa kembali data Anda.';
        }
      });
    </script>
  </body>
</html>
